    <text x="180" y="20" font-family="monospace" font-weight="700" font-size="18" fill="#F6F4EE">·</text>
    <text x="210" y="20" font-family="monospace" font-weight="700" font-size="18" fill="#E4E4E7">60 seg Sincronización</text>
    <text x="460" y="20" font-family="monospace" font-weight="700" font-size="18" fill="#F6F4EE">·</text>
    <text x="490" y="20" font-family="monospace" font-weight="700" font-size="18" fill="#C85A32">1 clic Facturas Gestoría</text>
