<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Logo Badge -->
  <g transform="translate(90, 95)">
    <rect width="56" height="56" rx="16" fill="#ea580c"/>
    <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">TX</text>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="36" fill="#F8FAFC">Turnexo<tspan fill="#ea580c">.</tspan></text>
  </g>

  <!-- Fiscal Badge -->
  <g transform="translate(620, 105)">
    <rect width="490" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="245" y="23" font-family="monospace" font-weight="800" font-size="12" fill="#34d399" letter-spacing="0.5" text-anchor="middle">LISTO PARA EL NUEVO MARCO FISCAL: IVA 10% Y MODELO 303</text>
  </g>

  <!-- Main Headline -->
  <text x="90" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="46" fill="#F8FAFC" letter-spacing="-1">
    Controla tus limpiezas, Guías Digitales
  </text>
  <text x="90" y="330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="46" fill="#F8FAFC" letter-spacing="-1">
    y facturas de IVA. <tspan fill="#ea580c">En piloto automático.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="90" y="405" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">
