  </text>

  <!-- Divider Line -->
  <line x1="90" y1="465" x2="1110" y2="465" stroke="#334155" stroke-width="1"/>

  <!-- Value Badges -->
  <g transform="translate(90, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="17" fill="#34d399">✓ 1 Alojamiento Gratis</text>
    <text x="240" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="17" fill="#64748B">•</text>
    <text x="270" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="17" fill="#CBD5E1">60 seg Sincronización iCal</text>
    <text x="560" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="17" fill="#64748B">•</text>
    <text x="590" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="17" fill="#FB923C">1 Clic Facturas Gestoría (Modelo 303)</text>
