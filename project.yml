# Genera SilentSnap.xcodeproj en macOS con:  brew install xcodegen && xcodegen generate
name: SilentSnap
options:
  bundleIdPrefix: com.silentsnap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""            # <- Tu Team ID
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SilentSnap:
    type: application
    platform: iOS
    sources:
      - path: SilentSnap
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silentsnap.app
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SilentSnap/Info.plist
      properties:
        CFBundleDisplayName: SilentSnap
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "SilentSnap usa la cámara para fotografiar carteles y tickets. Las imágenes se analizan solo en tu dispositivo."
        NSCalendarsWriteOnlyAccessUsageDescription: "SilentSnap añade los eventos detectados a tu Calendario. No puede leer tus eventos existentes."
    entitlements:
      path: SilentSnap/SilentSnap.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.silentsnap.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.silentsnap.shared
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silentsnap.app.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: SilentSnap
        NSCalendarsWriteOnlyAccessUsageDescription: "SilentSnap añade los eventos detectados a tu Calendario. No puede leer tus eventos existentes."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.silentsnap.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.silentsnap.shared

  SilentSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SilentSnapTests
    dependencies:
      - target: SilentSnap

schemes:
  SilentSnap:
    build:
      targets:
        SilentSnap: all
        ShareExtension: all
    test:
      targets:
        - SilentSnapTests
    run:
      config: Debug
      storeKitConfiguration: SilentSnap/Resources/SilentSnap.storekit
    archive:
      config: Release
