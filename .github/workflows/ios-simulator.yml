name: iOS Simulator Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build SilentSnap for iOS Simulator
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator (arm64 + x86_64)
        run: |
          xcodebuild build \
            -project SilentSnap.xcodeproj \
            -scheme SilentSnap \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app for Appetize.io / Simulator
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent SilentSnap.app "$GITHUB_WORKSPACE/SilentSnap-Simulator.zip"

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentSnap-iOS-Simulator-App
          path: SilentSnap-Simulator.zip
          retention-days: 30
