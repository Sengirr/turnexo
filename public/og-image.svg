<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#141413"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#1E1E1C" stroke="#2C2C29" stroke-width="2"/>
  
  <!-- Logo Badge -->
  <g transform="translate(100, 110)">
    <rect width="64" height="64" rx="12" fill="#C85A32"/>
    <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">TX</text>
    <text x="85" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#F6F4EE">Turnexo<tspan fill="#C85A32">.</tspan></text>
  </g>

